services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file: .env
    # Transactions need a replica set, and a replica set with auth needs a keyFile.
    entrypoint:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 > /tmp/keyfile
        chmod 400 /tmp/keyfile
        chown mongodb:mongodb /tmp/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/keyfile
    volumes:
      - mongo-data:/data/db
    # Also starts the replica set. mongosh on Mongo 6+, the legacy mongo shell
    # before it (servers without AVX run Mongo 4.4).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          $$(command -v mongosh || command -v mongo) --quiet
          -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 10s
      retries: 5

  api:
    image: ekalkutin/intentra-api:latest
    restart: always
    ports:
      - "6060:3000"
    env_file: .env
    environment:
      # Inside the network Mongo is `mongo`, not the host's localhost.
      DB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/intentra?authSource=admin&replicaSet=rs0&directConnection=true
    depends_on:
      mongo:
        condition: service_healthy

  web:
    image: ekalkutin/intentra-web:latest
    restart: always
    ports:
      - "6061:80"
    depends_on:
      - api

volumes:
  mongo-data:
