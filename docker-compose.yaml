services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file: .env
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", 'db.adminCommand("ping")']
      interval: 10s
      retries: 5

volumes:
  mongo-data:
