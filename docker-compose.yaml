services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - '5432:5432'
    env_file: .env
    volumes:
      # Since 18 the image keeps data in a versioned subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      retries: 5

volumes:
  postgres-data:
