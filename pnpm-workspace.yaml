packages:
  - "apps/*"
  - "contexts/*"
  - "libs/*"

catalog:
  zod: "^4.6.5"
  mongoose: "^9.10.2"
  ai: "^7.0.118"

catalogs:
  nestjs12:
    "@nestjs/common": "12.1.0"
    "@nestjs/core": "12.1.0"
    "@nestjs/platform-express": "12.1.0"
    "@nestjs/microservices": "12.1.0"
    "@nestjs/cqrs": "12.0.0"
    "@nestjs/config": "12.0.1"
    "@nestjs/testing": "12.1.0"
    "@nestjs/jwt": "12.0.2"
    "@nestjs/mongoose": "^12.0.0"
    reflect-metadata: "^0.2.2"
    rxjs: "^7.8.2"
  tooling:
    typescript: "7.0.2"
    vitest: "^5.0.2"
    "@vitest/coverage-v8": "^5.0.2"

allowBuilds:
  "@apollo/protobufjs": true
  "@nestjs/core": true
  esbuild: true
  nx: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.96'
  - ai@7.0.118
  - '@ai-sdk/react@4.0.121'
