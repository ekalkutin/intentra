packages:
  - "apps/*"
  - "contexts/*"
  - "libs/*"
  - "libs/*/*"

# Рантайм-зависимости, общие для всего воркспейса. Пакет пишет "catalog:".
# zod здесь, потому что на нём написан каждый опубликованный язык: схема из
# libs/contracts валидирует и на шлюзе, и в браузере — разъехавшиеся версии
# означали бы две несовпадающие проверки одного и того же сообщения.
catalog:
  zod: "^4.6.5"
  dotenv: "^18.0.1"

# Именованные наборы: версии, которые обязаны двигаться вместе.
# Пакет пишет "catalog:<имя>".
catalogs:
  nestjs12:
    "@nestjs/common": "12.0.4"
    "@nestjs/core": "12.0.4"
    "@nestjs/platform-express": "12.0.4"
    "@nestjs/microservices": "12.0.4"
    "@nestjs/cqrs": "12.0.0"
    "@nestjs/config": "12.0.0"
    "@nestjs/testing": "12.0.4"
    "@nestjs/jwt": "12.0.2"
    reflect-metadata: "^0.2.2"
    rxjs: "^7.8.2"
  tooling:
    "@types/node": "^26.6.2"
    typescript: "7.0.2"
    vitest: "^5.0.1"

# Разрешение на postinstall-скрипты выдаётся поимённо: по умолчанию pnpm их не
# исполняет. Пополняется по мере появления зависимостей.
allowBuilds:
  "@nestjs/core": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  nx: true
  prisma: true
  workerd: true

minimumReleaseAgeExclude:
  - "@nestjs/common@12.0.4"
  - "@nestjs/core@12.0.4"
  - "@nestjs/microservices@12.0.4"
  - "@nestjs/platform-express@12.0.4"
